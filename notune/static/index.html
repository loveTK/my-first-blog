<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Notune</title>
<style>
:root{--bg:#FAFAF7;--fg:#1C1C1C;--muted:#6B6B66;--line:#D9D9D3;--accent:#1F4FBF;--accent-fg:#FFFFFF;--panel:#FFFFFF;--err:#B3261E}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--fg:#EDEDE8;--muted:#9A9A93;--line:#3A3A37;--accent:#6E90E8;--accent-fg:#101010;--panel:#1F1F1D;--err:#F28B82}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:0 20px}
main{max-width:720px;margin:0 auto;padding:56px 0 40px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px}
.lead{margin:0 0 36px;color:var(--muted)}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:44px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--panel)}
.drop strong{display:block;font-weight:600;margin-bottom:4px}
.drop span{color:var(--muted);font-size:14px}
.drop input{display:none}
.file{margin:10px 0 0;font-size:14px;min-height:22px}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:26px 0 22px}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
select{width:100%;font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
select:focus,button:focus-visible,.drop:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;color:var(--accent-fg);background:var(--accent);border:0;border-radius:8px;padding:12px 22px;cursor:pointer;white-space:nowrap}
button:active{transform:translateY(1px)}
button[disabled]{opacity:.55;cursor:default}
.status{margin:14px 0 0;font-size:14px;min-height:22px}
.status.err{color:var(--err)}
.result{margin-top:34px;border-top:1px solid var(--line);padding-top:26px}
.result img{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;display:block}
.skel{height:280px;border-radius:8px;background:linear-gradient(90deg,var(--panel),var(--line),var(--panel));background-size:200% 100%;animation:sh 1.2s linear infinite}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
@keyframes sh{to{background-position:-200% 0}}
.dl{display:inline-block;margin-top:14px;font-weight:600;color:var(--accent);text-decoration:none;border-bottom:1.5px solid currentColor}
footer{margin-top:64px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
footer p{margin:4px 0}
</style>
<main>
  <h1>Notune</h1>
  <p class="lead">악보 PDF·JPG·PNG를 올리면 음표마다 계이름을 적어 돌려줍니다. 파일은 서버에 저장하지 않습니다.</p>

  <form id="f">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="악보 파일 선택">
      <strong>악보 파일을 여기에 끌어다 놓거나 클릭</strong>
      <span>PDF, JPG, PNG · 20MB까지</span>
      <input type="file" name="file" id="file" accept=".pdf,.jpg,.jpeg,.png" required>
    </div>
    <p class="file" id="fname"></p>

    <div class="opts">
      <div><label for="lang">계이름 표기</label>
        <select name="lang" id="lang">
          <option value="ko">도레미 (한국어)</option><option value="en">C D E (영어)</option>
          <option value="it">Do Re Mi (이탈리아어)</option><option value="ja">ドレミ (일본어)</option><option value="de">C D E H (독일어)</option>
        </select></div>
      <div><label for="position">라벨 위치</label>
        <select name="position" id="position"><option value="below">음표 아래</option><option value="above">음표 위</option></select></div>
      <div><label for="mode">배치 방식</label>
        <select name="mode" id="mode"><option value="greedy">겹침 피해 배치</option><option value="lane">줄 맞춰 배치</option><option value="overlay">음표 위에 덮기</option></select></div>
    </div>

    <button id="go">계이름 넣기</button>
    <p class="status" id="s"></p>
  </form>

  <section class="result" id="result" hidden>
    <div class="skel" id="skel" hidden></div>
    <img id="img" hidden alt="계이름이 적힌 악보 미리보기">
    <p id="pdfnote" hidden>PDF는 미리보기 대신 파일로 내려받습니다.</p>
    <a id="dl" class="dl" hidden>결과 파일 내려받기</a>
  </section>

  <footer>
    <p>음표 인식 모델은 DeepScoresV2 데이터셋(Tuggener et al., CC BY 4.0)으로 학습했습니다.</p>
    <p>업로드한 파일과 결과는 처리 직후 삭제됩니다.</p>
  </footer>
</main>
<script>
const $ = id => document.getElementById(id);
const drop = $('drop'), file = $('file'), fname = $('fname'), s = $('s'), go = $('go');
const show = (el, on) => { el.hidden = !on; };
const pick = f => { if (f) { file.files = f; } fname.textContent = file.files[0] ? file.files[0].name : ''; };
drop.onclick = () => file.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } };
file.onchange = () => pick();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); pick(e.dataTransfer.files); };

$('f').onsubmit = async e => {
  e.preventDefault();
  if (!file.files[0]) { s.className = 'status err'; s.textContent = '먼저 악보 파일을 선택하세요.'; return; }
  const isPdf = /\.pdf$/i.test(file.files[0].name);
  go.disabled = true; s.className = 'status'; s.textContent = '음표를 읽는 중입니다. 페이지당 10초쯤 걸립니다.';
  show($('result'), true); show($('skel'), true); show($('img'), false); show($('dl'), false); show($('pdfnote'), false);
  try {
    const r = await fetch('/convert', { method: 'POST', body: new FormData($('f')) });
    if (!r.ok) {
      let msg = '처리에 실패했습니다.';
      try { const j = await r.json(); if (j.detail) msg = j.detail; } catch (_) { if (r.status === 500) msg = '이 악보에서 오선을 찾지 못했습니다. 더 선명한 이미지로 다시 시도해 보세요.'; }
      throw new Error(msg);
    }
    const b = await r.blob(), u = URL.createObjectURL(b);
    const dl = $('dl'); dl.href = u; dl.download = file.files[0].name.replace(/\.(\w+)$/, '_plus.$1');
    show($('skel'), false); show(dl, true);
    if (isPdf) show($('pdfnote'), true); else { $('img').src = u; show($('img'), true); }
    s.textContent = '완료';
  } catch (err) {
    show($('result'), false); s.className = 'status err'; s.textContent = err.message;
  } finally { go.disabled = false; }
};
</script>
</html>
