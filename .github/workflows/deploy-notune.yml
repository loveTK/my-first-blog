name: deploy notune to lightsail
on:
  push:
    branches: [claude/playwright-plugin-install-bgpysg]
    paths: [notune/**, .github/workflows/deploy-notune.yml]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - run: |
          sudo curl -sL https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl \
            -o /usr/local/bin/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl
      - run: docker build -t notune notune/
      - id: push
        run: |
          set -euo pipefail
          aws lightsail push-container-image \
            --service-name notune --label notune --image notune \
            | tee push.log
          echo "image=$(grep -oP '(?<=Refer to this image as ")[^"]+' push.log)" >> "$GITHUB_OUTPUT"
      - run: |
          cat > deploy.json <<EOF
          {"notune": {"image": "${{ steps.push.outputs.image }}", "ports": {"8000": "HTTP"}}}
          EOF
          aws lightsail create-container-service-deployment \
            --service-name notune \
            --containers file://deploy.json \
            --public-endpoint '{"containerName":"notune","containerPort":8000,"healthCheck":{"path":"/"}}'
      - name: CDN 배포(전세계 엣지 라우팅, 이미 있으면 건너뜀) — 월 ~$2.50 추가 과금
        run: |
          if aws lightsail get-distributions --distribution-name notune-cdn >/dev/null 2>&1; then
            echo "notune-cdn 이미 있음, 건너뜀"
          else
            aws lightsail create-distribution \
              --distribution-name notune-cdn \
              --origin resourceName=notune,regionName=${{ secrets.AWS_REGION }} \
              --default-cache-behavior behavior=dont-cache \
              --bundle-id small_1_0
          fi
